<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.project_name }} | Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
        }
        .detail-container {
            max-width: 800px;
            margin: 80px auto;
            padding: 30px;
            background-color: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .tech-badge {
            background-color: #2d3748;
            color: #63b3ed;
            padding: 6px 12px;
            border-radius: 4px;
            margin-right: 8px;
            display: inline-block;
            font-size: 0.9rem;
        }
        .btn-back {
            color: #a0aec0;
            text-decoration: none;
        }
        .btn-back:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="detail-container">
            <a href="{% url 'project_list' %}" class="btn-back">← Back to Projects</a>
            
            <hr class="border-secondary my-4">

            <h1 class="display-5 fw-bold text-white mb-3">{{ project.project_name }}</h1>

            <div class="mb-4">
                <span class="text-muted d-block mb-2">Tech Stack:</span>
                <div class="d-flex flex-wrap gap-2">
                    <span class="tech-badge">{{ project.tech_stack }}</span>
                </div>
            </div>

            <div class="mb-4">
                <h4 class="text-white">Project Description</h4>
                <p class="lead text-secondary" style="white-space: pre-line;">
                    {{ project.description }}
                </p>
            </div>

            {% if project.link %}
            <div class="mt-5">
                <a href="{{ project.link }}" target="_blank" class="btn btn-primary px-4 py-2">
                    View Live Project / Repository
                </a>
            </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
