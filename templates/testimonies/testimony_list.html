<!DOCTYPE html>
<html>
<head>
    <title>Testimonials</title>
    <style>
        body { background-color: #0d1b2a; font-family: Arial, sans-serif; color: #fff; }
        h1 { color: #00b4d8; margin: 0; }
        .container { width: 60%; margin: auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }
        .highlight-box {
            background: #1b263b;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #00b4d8;
            text-align: left;
        }
        .author {
            font-weight: bold;
            color: #f77f00;
            margin-bottom: 5px;
        }
        .view-btn {
            background: #00b4d8;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
        .view-btn:hover { background: #f77f00; }
        .add-btn {
            background: #00b4d8;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }
        .add-btn:hover { background: #f77f00; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TESTIMONIALS</h1>
            <a href="{% url 'testimony_create' %}" class="add-btn">+ Add Testimony</a>
        </div>

        {% for t in testimonies %}
            <div class="highlight-box">
                <p class="author">{{ t.full_name }}</p>
                <p>{{ t.content|truncatewords:20 }}</p>
                <a href="{% url 'testimony_detail' t.pk %}" class="view-btn">View Testimony</a>
            </div>
        {% empty %}
            <p>No testimonies yet.</p>
        {% endfor %}
    </div>
</body>
</html>
