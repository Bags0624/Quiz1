<!DOCTYPE html>
<html>
<head>
    <title>Testimonials</title>
    <style>
        body { background-color: #0d0d1a; font-family: Arial, sans-serif; color: #fff; }
        h1 { color: #00aaff; margin: 0; }
        .container { width: 60%; margin: auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }
        .testimony {
            background: #1e1e2f;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #00aaff;
            position: relative;
        }
        .author {
            font-weight: bold;
            color: #ff6600;
            margin-bottom: 5px;
        }
        .project {
            color: #00aaff;
            margin-bottom: 10px;
        }
        .date {
            font-size: 0.85em;
            color: #aaa;
            margin-top: 10px;
        }
        .view-btn {
            background: #00aaff;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            position: absolute;
            bottom: 15px;
            right: 15px;
        }
        .add-btn {
            background: #00aaff;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }
        .add-btn:hover {
            background: #ff6600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TESTIMONIALS</h1>
            <a href="{% url 'testimony_create' %}" class="add-btn">+ Add Testimony</a>
        </div>

        {% for t in testimonies %}
            <div class="testimony">
                <p class="author">{{ t.author }}</p>
                <p class="project">{{ t.project }}</p>
                <p class="date">{{ t.created_at|date:"M d, Y" }}</p>
                <a href="{% url 'testimony_detail' t.pk %}" class="view-btn">View Testimony</a>
            </div>
        {% empty %}
            <p>No testimonies yet.</p>
        {% endfor %}
    </div>
</body>
</html>
