<!DOCTYPE html>
<html>
<head>
    <title>Testimony Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1b2a; color: #ffffff; font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin-top: 50px; background: #1b263b; padding: 20px; border-radius: 8px; border: 1px solid #00b4d8; }
        h1 { color: #00b4d8; margin-bottom: 20px; }
        a.back-link { color: #00b4d8; text-decoration: none; font-weight: bold; }
        a.back-link:hover { color: #f77f00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ testimony.full_name }}</h1>
        <p>{{ testimony.content }}</p>
        <br>
        <a href="{% url 'testimony_list' %}" class="back-link">← Back to Testimonials</a>
    </div>
</body>
</html>
