<!DOCTYPE html>
<html>
<head>
    <title>Share Your Testimony</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            background: #1b263b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #00b4d8;
        }
        h1 {
            color: #00b4d8;
            margin-bottom: 20px;
        }
        .btn-submit {
            background-color: #00b4d8;
            color: #fff;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #f77f00;
        }
        a.back-link {
            color: #00b4d8;
            text-decoration: none;
            font-weight: bold;
        }
        a.back-link:hover {
            color: #f77f00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Share Your Testimony</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-submit">Submit</button>
        </form>
        <br>
        <a href="{% url 'testimony_list' %}" class="back-link">← Back to Testimonials</a>
    </div>
</body>
</html>
