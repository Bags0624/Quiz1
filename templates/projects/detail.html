<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ project.project_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#121212; color:#e0e0e0;">
  <div class="container mt-4">
    <div class="card p-4" style="background-color:#1e1e1e; border-radius:8px;">
      <h2>Project: {{ project.project_name }}</h2>
      <p><strong>Description:</strong> {{ project.description }}</p>
      <p><strong>Tech Stack:</strong> {{ project.tech_stack }}</p>
      {% if project.link %}
        <p><a href="{{ project.link }}" target="_blank" class="btn btn-info">View Project</a></p>
      {% endif %}
      <a href="{% url 'project_list' %}" class="btn btn-secondary mt-3">Back to Projects</a>
    </div>
  </div>
</body>
</html>
