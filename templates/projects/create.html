<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#0d1b2a; color:#fff; text-align:center;">
  <div class="container text-center mt-5">
    <div class="p-5" style="max-width:600px; margin:auto; background-color:#1e1e1e; border-radius:8px;">
      <h2 style="color:#00b4d8;">🚀 Got a project in mind?</h2>
      <p class="mb-4" style="color:#f77f00;">Let’s build it together — fill out the details below.</p>
      
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-info w-100 fw-bold">Submit Project</button>
      </form>

      <a href="{% url 'project_list' %}" class="btn btn-secondary w-100 fw-bold mt-3">View Projects</a>
    </div>
  </div>
</body>
</html>
