<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#0d1b2a; color:#fff;">
  <div class="container mt-4">
    <h2>Projects</h2>
    <a href="{% url 'project_create' %}" class="btn btn-primary mb-3">Add Project</a>
    <ul class="list-group">
      {% for project in projects %}
        <li class="list-group-item" style="background-color:#1e1e1e; color:#e0e0e0;">
          <a href="{% url 'project_detail' project.pk %}" style="color:#00b4d8; text-decoration:none;">
            {{ project.project_name }}
          </a>
        </li>
      {% empty %}
        <li class="list-group-item" style="background-color:#1e1e1e; color:#e0e0e0;">No projects yet.</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
